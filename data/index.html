          <!-- Load Chart.js with CDN fallback detection for better mDNS compatibility -->
    <script>
      // Chart.js library loading management
      let chartLibrariesReady = false;
      
      function showCDNError() {
        const chartContainer = document.querySelector('.chart-container');
        if (chartContainer) {
          chartContainer.innerHTML = `
            <div style="background: #f8d7da; color: #721c24; padding: 20px; border: 1px solid #f5c6cb; border-radius: 10px; text-align: center;">
              <h3>Chart Library Loading Failed</h3>
              <p>Unable to load Chart.js from CDN. This commonly happens with mDNS (.local) hostnames.</p>
              <p><strong>Solutions:</strong></p>
              <ul style="text-align: left; display: inline-block;">
                <li>Use IP address instead: <a href="#" id="ipAlternative" style="color: #721c24;">Loading IP...</a></li>
                <li>Check internet connection</li>
                <li>Refresh the page</li>
              </ul>
              <button onclick="location.reload()" style="margin-top: 10px; padding: 10px 20px; background: #dc3545; color: white; border: none; border-radius: 5px; cursor: pointer;">Retry</button>
            </div>
          `;
          
          // Fetch and display the actual IP address
          fetch('/debug')
            .then(response => response.json())
            .then(data => {
              const ipLink = document.getElementById('ipAlternative');
              if (ipLink && data.localIP) {
                const ipUrl = `http://${data.localIP}`;
                ipLink.href = ipUrl;
                ipLink.textContent = ipUrl;
              }
            })
            .catch(err => {
              console.error('Could not fetch IP:', err);
              const ipLink = document.getElementById('ipAlternative');
              if (ipLink) {
                ipLink.textContent = 'IP address unavailable';
              }
            });
        }
      }
    </script>
    
    <script>
      // Load scripts sequentially to ensure proper dependency order
      let loadedScripts = [];
      const scriptsToLoad = [
        '/js/moment.min.js',
        '/js/chart.umd.js', 
        '/js/chartjs-adapter-moment.min.js',
        '/js/chartjs-plugin-zoom.min.js'
      ];
      
      function loadNextScript(index = 0) {
        if (index >= scriptsToLoad.length) {
          // All scripts loaded, verify Chart object
          setTimeout(() => {
            if (typeof Chart !== 'undefined') {
              chartLibrariesReady = true;
              console.log('All Chart.js libraries loaded successfully');
            } else {
              console.error('Chart.js scripts loaded but Chart object is undefined');
              showCDNError();
            }
          }, 100);
          return;
        }
        
        const script = document.createElement('script');
        script.src = scriptsToLoad[index];
        script.type = 'text/javascript';
        
        script.onload = function() {
          console.log('Loaded:', scriptsToLoad[index]);
          loadedScripts.push(scriptsToLoad[index]);
          loadNextScript(index + 1);
        };
        
        script.onerror = function() {
          console.error('Failed to load:', scriptsToLoad[index]);
          showCDNError();
        };
        
        document.head.appendChild(script);
      }
      
      // Start loading
      loadNextScript();
    </script>

    // Timestamp validation helper
    function isValidTimestamp(timestamp) {
      if (!timestamp) return false;
      const time = timestamp instanceof Date ? timestamp.getTime() : new Date(timestamp).getTime();
      // Check if timestamp is reasonable (between year 2020 and 2030)
      const min = new Date('2020-01-01').getTime();
      const max = new Date('2030-12-31').getTime();
      return !isNaN(time) && time >= min && time <= max;
    }
    
    // Clean chart data to remove invalid timestamps
    function cleanChartData() {
      if (!energyChart || !energyChart.data) return;
      
      const validIndices = [];
      energyChart.data.labels.forEach((label, idx) => {
        if (isValidTimestamp(label)) {
          validIndices.push(idx);
        } else {
          console.warn(`Removing invalid timestamp at index ${idx}:`, label);
        }
      });
      
      if (validIndices.length < energyChart.data.labels.length) {
        energyChart.data.labels = validIndices.map(i => energyChart.data.labels[i]);
        energyChart.data.datasets.forEach(dataset => {
          dataset.data = validIndices.map(i => dataset.data[i]);
        });
        console.log(`Cleaned chart: removed ${energyChart.data.labels.length - validIndices.length} invalid points`);
      }
    }
    
    function updateConnectionStatus(status, message) {
      const statusEl = document.getElementById('connectionStatus');
      if (status === 'connected') {
        statusEl.style.background = '#28a745';
        statusEl.innerText = 'Connected';
        connectionFailures = 0;
        lastSuccessfulFetch = Date.now();
      } else if (status === 'warning') {
        statusEl.style.background = '#ffc107';
        statusEl.style.color = '#856404';
        statusEl.innerText = message || 'Slow Connection';
      } else {
        statusEl.style.background = '#dc3545';
        statusEl.style.color = 'white';
        statusEl.innerText = message || 'Connection Error';
        connectionFailures++;
      }
    }

    function downsampleHistory(data, intervalSeconds) {
      let downsampled = [];
      if(data.length === 0) return downsampled;

      let bucketStart = moment.utc(data[0].timestamp, "YYYYMMDDTHHmmssSSS");
      let bucketEnd = bucketStart.clone().add(intervalSeconds, 'seconds');
      let bucket = { timestamp: bucketStart.format("YYYYMMDDTHHmmssSSS"), Grid: 0, Solar: 0, Consumer: 0, count: 0 };

      data.forEach(point => {
        let pointTime = moment.utc(point.timestamp, "YYYYMMDDTHHmmssSSS");
        if(pointTime.isBefore(bucketEnd)) {
          bucket.Grid += point.Grid;
          bucket.Solar += point.Solar;
          bucket.Consumer += point.Consumer;
          bucket.count++;
        } else {
          if(bucket.count > 0) {
            bucket.Grid /= bucket.count;
            bucket.Solar /= bucket.count;
            bucket.Consumer /= bucket.count;
          }
          downsampled.push({ ...bucket });
          bucketStart = bucketEnd.clone();
          bucketEnd = bucketStart.clone().add(intervalSeconds, 'seconds');
          bucket = { timestamp: point.timestamp, Grid: point.Grid, Solar: point.Solar, Consumer: point.Consumer, count: 1 };
        }
      });

      if(bucket.count > 0) {
        bucket.Grid /= bucket.count;
        bucket.Solar /= bucket.count;
        bucket.Consumer /= bucket.count;
        downsampled.push({ ...bucket });
      }
      return downsampled;
    }

    // Progressive loading - start with limited history, then load full data
    let isFullHistoryLoaded = false;
    let quickLoadCount = 30; // Only load last 30 points initially

    function loadHistoryQuick() {
      console.log("Quick loading last " + quickLoadCount + " history points...");
      
      fetch('/debug')
        .then(response => response.json())
        .then(debugData => {
          if (debugData.recentHistory && debugData.recentHistory.length > 0) {
            console.log("Using recent history from debug endpoint for quick load");
            
            // Clear existing data
            energyChart.data.labels = [];
            energyChart.data.datasets.forEach(ds => ds.data = []);
            
            debugData.recentHistory.forEach(point => {
              let timeLabel = new Date(point.timestamp);
              energyChart.data.labels.push(timeLabel);
              energyChart.data.datasets[0].data.push(point.grid);
              energyChart.data.datasets[1].data.push(point.solar);
              energyChart.data.datasets[2].data.push(point.consumer);
            });
            
            energyChart.update('none');
            console.log("Quick history loaded with " + debugData.recentHistory.length + " points");
            
            // Load full history after a short delay
            setTimeout(() => {
              if (!isFullHistoryLoaded) {
                console.log("Loading full history...");
                loadHistory();
              }
            }, 2000);
          } else {
            // Fallback to full history load
            loadHistory();
          }
        })
        .catch(error => {
          console.warn("Quick load failed, falling back to full history:", error);
          loadHistory();
        });
    }

    function loadHistory() {
      if (isFullHistoryLoaded) {
        console.log("Full history already loaded, skipping...");
        return;
      }
      
      console.log("Loading history data from /history...");
      
      // Add timeout to prevent hanging requests with mDNS
      const controller = new AbortController();
      const timeoutId = setTimeout(() => {
        controller.abort();
        console.warn("History fetch timed out after 8 seconds");
      }, 8000); // 8 second timeout
      
      fetch('/history', { 
        signal: controller.signal,
        cache: 'no-cache' // Prevent caching issues with mDNS
      })
        .then(response => {
          clearTimeout(timeoutId);
          if (!response.ok) throw new Error(`HTTP ${response.status}: ${response.statusText}`);
          return response.json();
        })
        .then(data => {
          console.log(`Parsed history data: ${data.length} points`);
          isFullHistoryLoaded = true;
          
          let intervalSeconds = parseInt(frequencySlider.value);
          let downsampledData = downsampleHistory(data, intervalSeconds);
          console.log(`Downsampled to ${downsampledData.length} points for better performance`);
          
          // Clear existing data
          energyChart.data.labels = [];
          energyChart.data.datasets.forEach(ds => ds.data = []);
          
          // Sort history data by timestamp to ensure chronological order
          downsampledData.sort((a, b) => {
            const timeA = moment.utc(a.timestamp, "YYYYMMDDTHHmmssSSS");
            const timeB = moment.utc(b.timestamp, "YYYYMMDDTHHmmssSSS");
            return timeA.valueOf() - timeB.valueOf();
          });
          
          console.log("Loading history points in chronological order:");
          downsampledData.forEach((point, index) => {
            let timeLabel = moment.utc(point.timestamp, "YYYYMMDDTHHmmssSSS").toDate();
            
            // Validate timestamp before adding
            if (!isValidTimestamp(timeLabel)) {
              console.warn(`Skipping history point ${index} with invalid timestamp:`, point.timestamp, timeLabel);
              return;
            }
            
            if (index < 3 || index >= downsampledData.length - 3) { // Only log first and last few points
              console.log(`History ${index}: ${timeLabel.toISOString()} - Grid:${point.Grid}, Solar:${point.Solar}, Consumer:${point.Consumer}`);
            }
            
            energyChart.data.labels.push(timeLabel);
            energyChart.data.datasets[0].data.push(point.Grid);
            energyChart.data.datasets[1].data.push(point.Solar);
            energyChart.data.datasets[2].data.push(point.Consumer);
          });

          // Store the last history timestamp for comparison with real-time data
          if (downsampledData.length > 0) {
            window.lastHistoryTimestamp = moment.utc(downsampledData[downsampledData.length - 1].timestamp, "YYYYMMDDTHHmmssSSS").toDate();
            console.log("Last history timestamp:", window.lastHistoryTimestamp.toISOString());
          }

          // Clean any invalid data before updating
          cleanChartData();
          
          energyChart.update('none'); // Use 'none' animation for better performance
          console.log("Full history loaded, sorted, and chart updated.");
        })
        .catch(error => {
          clearTimeout(timeoutId);
          console.error("Error loading history:", error);
          
          // Show user-friendly error message
          const chartContainer = document.querySelector('.chart-container');
          if (chartContainer) {
            const errorDiv = document.createElement('div');
            errorDiv.style.cssText = 'background: #f8d7da; color: #721c24; padding: 10px; border: 1px solid #f5c6cb; border-radius: 5px; margin: 10px 0;';
            errorDiv.innerHTML = `
              <strong>Chart Loading Error:</strong> ${error.message}<br>
              <small>This often happens with mDNS (.local) hostnames. Try using the IP address instead, or wait and the chart will retry automatically.</small>
              <button onclick="loadHistory()" style="margin-left: 10px; padding: 5px 10px;">Retry</button>
            `;
            
            // Remove any existing error messages
            const existingError = chartContainer.querySelector('[data-error="history"]');
            if (existingError) existingError.remove();
            
            errorDiv.setAttribute('data-error', 'history');
            chartContainer.insertBefore(errorDiv, chartContainer.firstChild);
          }
          
          // Auto-retry after 10 seconds
          setTimeout(() => {
            console.log("Auto-retrying history load...");
            isFullHistoryLoaded = false; // Allow retry
            loadHistory();
          }, 10000);
        });
    }

    function updateTrendChart(chart, data) {
      if (!chart) return;
      chart.data.labels = [];
      chart.data.datasets.forEach(ds => ds.data = []);
      data.forEach(point => {
        const timeLabel = moment.utc(point.timestamp, "YYYYMMDDTHHmmssSSS").toDate();
        chart.data.labels.push(timeLabel);
        chart.data.datasets[0].data.push(point.Grid);
        chart.data.datasets[1].data.push(point.Solar);
        chart.data.datasets[2].data.push(point.Consumer);
      });
      chart.update('none');
    }

    function loadHistory24h() {
      console.log("Loading 24h aggregates...");
      fetch('/history/24h', { cache: 'no-cache' })
        .then(response => {
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          return response.json();
        })
        .then(data => {
      data.sort((a, b) => moment.utc(a.timestamp, "YYYYMMDDTHHmmssSSS").valueOf() - moment.utc(b.timestamp, "YYYYMMDDTHHmmssSSS").valueOf());
          updateTrendChart(energyChart24h, data);
        })
        .catch(error => console.error("24h history load failed:", error));
    }

    function loadHistory30d() {
      console.log("Loading 30d aggregates...");
      fetch('/history/30d', { cache: 'no-cache' })
        .then(response => {
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          return response.json();
        })
        .then(data => {
      data.sort((a, b) => moment.utc(a.timestamp, "YYYYMMDDTHHmmssSSS").valueOf() - moment.utc(b.timestamp, "YYYYMMDDTHHmmssSSS").valueOf());
          updateTrendChart(energyChart30d, data);
        })
        .catch(error => console.error("30d history load failed:", error));
    }

    function addRealtimePoint(timeLabel, gridPower, solarPower, consumerPower, animationMode = 'none') {
      if (!energyChart) return;
      const labels = energyChart.data.labels;
      let insertIdx = labels.length;
      for (let i = labels.length - 1; i >= 0; i--) {
        if (timeLabel >= labels[i]) {
          insertIdx = i + 1;
          break;
        }
        if (i === 0) {
          insertIdx = 0;
        }
      }

      const insertData = (dataset, value) => dataset.data.splice(insertIdx, 0, value);

      if (insertIdx === labels.length) {
        labels.push(timeLabel);
        energyChart.data.datasets[0].data.push(gridPower);
        energyChart.data.datasets[1].data.push(solarPower);
        energyChart.data.datasets[2].data.push(consumerPower);
      } else {
        labels.splice(insertIdx, 0, timeLabel);
        energyChart.data.datasets.forEach((dataset, idx) => {
          const value = idx === 0 ? gridPower : idx === 1 ? solarPower : consumerPower;
          insertData(dataset, value);
        });
      }

      while (labels.length > 300) {
        labels.shift();
        energyChart.data.datasets.forEach(dataset => dataset.data.shift());
      }

      cleanChartData();
      energyChart.update(animationMode);
    }
    
    function clearHistoryData() {
      if (!confirm('Clear stored history for 1h, 24h, and 30d datasets?')) return;
      const statusEl = document.getElementById('historyClearStatus');
      statusEl.innerText = 'Clearing history...';
      fetch('/history/reset', { method: 'POST' })
        .then(response => {
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          return response.json().catch(() => ({ success: true }));
        })
        .then(() => {
          statusEl.innerText = 'History cleared';
          isFullHistoryLoaded = false;
          if (energyChart) {
            energyChart.data.labels = [];
            energyChart.data.datasets.forEach(ds => ds.data = []);
            energyChart.update('none');
          }
          if (energyChart24h) {
            energyChart24h.data.labels = [];
            energyChart24h.data.datasets.forEach(ds => ds.data = []);
            energyChart24h.update('none');
          }
          if (energyChart30d) {
            energyChart30d.data.labels = [];
            energyChart30d.data.datasets.forEach(ds => ds.data = []);
            energyChart30d.update('none');
          }
          loadHistoryQuick();
          loadHistory24h();
          loadHistory30d();
          setTimeout(() => statusEl.innerText = 'Clears 1h, 24h, and 30d datasets', 4000);
        })
        .catch(error => {
          console.error("Failed to clear history:", error);
          statusEl.innerText = `Error clearing history: ${error.message}`;
          setTimeout(() => statusEl.innerText = 'Clears 1h, 24h, and 30d datasets', 6000);
        });
    }

    // Use lightweight endpoint for frequent updates
    function fetchDataLight() {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => {
        controller.abort();
      }, 3000); // 3 second timeout for lightweight requests
      
      fetch('/metrics', { 
        signal: controller.signal,
        cache: 'no-cache'
      })
        .then(response => {
           clearTimeout(timeoutId);
           if (!response.ok) throw new Error(`HTTP ${response.status}: ${response.statusText}`);
           return response.json();
        })
                 .then(data => {
            // Update connection status on successful fetch
            updateConnectionStatus('connected');
            
            // Clear any existing error messages on successful fetch
            const errorDiv = document.querySelector('[data-error="data"]');
            if (errorDiv) errorDiv.remove();
            
            let gridPower = 0, solarPower = 0, consumerPower = 0;

           data.meters.forEach(item => {
                if (item.name === 'Grid') gridPower = item.power;
                else if (item.name === 'Solar') solarPower = item.power;
                else if (item.name === 'Consumer') consumerPower = item.power;
           });

           // Update metric cards with correct values
           document.getElementById('gridValue').innerText = Math.abs(gridPower);
           document.getElementById('solarValue').innerText = solarPower;
           document.getElementById('consumerValue').innerText = consumerPower;
           
           // Update grid status indicator
           const gridStatus = document.getElementById('gridStatus');
           if (gridPower < 0) {
               gridStatus.innerText = 'Exporting';
               gridStatus.style.color = '#27ae60'; // Green for export
           } else {
               gridStatus.innerText = 'Importing';
               gridStatus.style.color = '#e74c3c'; // Red for import
           }

           const sourceTimestamp = data.timestamp ? Number(data.timestamp) : Date.now();
           let timeLabel = new Date(sourceTimestamp);
           addRealtimePoint(timeLabel, gridPower, solarPower, consumerPower, 'none');
        })
                 .catch(error => {
            clearTimeout(timeoutId);
            updateConnectionStatus('error', 'Fetch Failed');
            // Fallback to full data fetch
            fetchData();
         });
    }

    function fetchData() {
      console.log('Fetching current data from /data...');
      const fetchStartTime = Date.now();
      
      // Add timeout for data fetching too
      const controller = new AbortController();
      const timeoutId = setTimeout(() => {
        controller.abort();
        console.warn("Data fetch timed out after 5 seconds");
      }, 5000); // 5 second timeout for real-time data
      
      fetch('/data', { 
        signal: controller.signal,
        cache: 'no-cache' // Prevent caching issues
      })
        .then(response => {
           clearTimeout(timeoutId);
           if (!response.ok) throw new Error(`HTTP ${response.status}: ${response.statusText}`);
           return response.json();
        })
        .then(data => {
           const fetchEndTime = Date.now();
           const fetchDuration = fetchEndTime - fetchStartTime;
           
           // Update connection status based on performance
           if (fetchDuration > 2000) {
             updateConnectionStatus('warning', 'Slow Response');
             console.warn(`Slow data fetch took ${fetchDuration}ms`);
           } else {
             updateConnectionStatus('connected');
           }
           
           // Clear any existing error messages on successful fetch
           const errorDiv = document.querySelector('[data-error="data"]');
           if (errorDiv) errorDiv.remove();
           
           // No redirects - always stay on current URL
           
           let gridPower = 0, solarPower = 0, consumerPower = 0;

           data.meters.forEach(item => {
                if (item.name === 'Grid') gridPower = item.power;
                else if (item.name === 'Solar') solarPower = item.power;
                else if (item.name === 'Consumer') consumerPower = item.power;
           });

           // Update metric cards with correct values
           document.getElementById('gridValue').innerText = Math.abs(gridPower);
           document.getElementById('solarValue').innerText = solarPower;
           document.getElementById('consumerValue').innerText = consumerPower;
           
           // Update grid status indicator
           const gridStatus = document.getElementById('gridStatus');
           if (gridPower < 0) {
               gridStatus.innerText = 'Exporting';
               gridStatus.style.color = '#27ae60'; // Green for export
           } else {
               gridStatus.innerText = 'Importing';
               gridStatus.style.color = '#e74c3c'; // Red for import
           }
           
           // Update uptime information
           if (data.uptime) {
               document.getElementById('uptimeValue').innerText = 'Uptime: ' + data.uptime;
           }

           // Use timestamp from device/Shelly if provided
           const sourceTimestamp = data.timestamp ? Number(data.timestamp) : Date.now();
           let timeLabel = new Date(sourceTimestamp);
           
           // Validate timestamp before adding
           if (!isValidTimestamp(timeLabel)) {
               console.error(`Invalid timestamp detected: ${timeLabel}`);
               return;
           }
           
           let lastTime = energyChart.data.labels.length > 0 ? 
                         energyChart.data.labels[energyChart.data.labels.length - 1] : null;
           
           // Check if this data point is older than the last history point
           if (window.lastHistoryTimestamp && timeLabel <= window.lastHistoryTimestamp) {
               console.warn(`Skipping real-time data point that's older than history. Current: ${timeLabel.toISOString()}, Last history: ${window.lastHistoryTimestamp.toISOString()}`);
               return;
           }
           
           // Debug logging for time issues
           if (lastTime && timeLabel < lastTime) {
               console.warn(`Time going backwards! Last: ${lastTime.toISOString()}, Current: ${timeLabel.toISOString()}`);
               return; // Don't add data that goes backwards
           }
           
           console.log(`Adding chart point at ${timeLabel.toISOString()}: Grid=${gridPower}W, Solar=${solarPower}W, Consumer=${consumerPower}W`);
           addRealtimePoint(timeLabel, gridPower, solarPower, consumerPower);
           console.log(`Chart updated. Total points: ${energyChart.data.labels.length}`);
        })
        .catch(error => {
           clearTimeout(timeoutId);
           updateConnectionStatus('error', error.name === 'AbortError' ? 'Timeout' : 'Error');
           console.error("Error fetching data:", error);
           console.error("Fetch duration before error:", Date.now() - fetchStartTime, "ms");
           
           // Show user-friendly error message for data fetch issues
           const uptimeElement = document.getElementById('uptimeValue');
           if (uptimeElement) {
             uptimeElement.style.color = '#e74c3c';
             uptimeElement.innerText = `Connection Error: ${error.message}`;
             
             // Reset after 5 seconds
             setTimeout(() => {
               uptimeElement.style.color = '';
               uptimeElement.innerText = 'Reconnecting...';
             }, 5000);
           }
        });
    }

      Promise.all([
        fetch('/debug').then(r => r.json()),

        console.log(`Device time: ${new Date(deviceTime).toISOString()}`);

        console.log(`Device uptime: ${debugData.deviceTime}ms`);

          console.log(`Last values: Grid=${energyChart.data.datasets[0].data[lastIndex]}, Solar=${energyChart.data.datasets[1].data[lastIndex]}, Consumer=${energyChart.data.datasets[2].data[lastIndex]}`);
          
          // Check for time ordering issues
          console.log("Last 5 chart timestamps:");
          const startIdx = Math.max(0, energyChart.data.labels.length - 5);
          for (let i = startIdx; i < energyChart.data.labels.length; i++) {
            console.log(`  ${i}: ${energyChart.data.labels[i].toISOString()}`);
          }
        }
        
        if (window.lastHistoryTimestamp) {
          console.log(`Last history timestamp: ${window.lastHistoryTimestamp.toISOString()}`);

      }).catch(error => console.error("Debug data fetch error:", error));

    function initializeApp() {
      console.log("Initializing app with Chart.js libraries loaded");
      
      // Initialize the chart first
      if (!initializeChart()) {
        console.error("Failed to initialize chart - aborting app initialization");
        return;
      }
      
      // Progressive loading for better performance
      setTimeout(() => {
        loadHistoryQuick();  // Quick load first for immediate feedback
        loadHistory24h();
        loadHistory30d();
        fetchData();         // Get current data with time/uptime info
      }, 300);
      
      // Set up intervals - lightweight updates frequently, full updates less often
      fetchIntervalID = setInterval(fetchDataLight, 2000); // Lightweight every 2 seconds
      setInterval(fetchData, 10000); // Full data every 10 seconds for uptime/time
      setInterval(loadHistory24h, 5 * 60 * 1000);  // Refresh 24h chart every 5 minutes
      setInterval(loadHistory30d, 30 * 60 * 1000); // Refresh 30d chart every 30 minutes
    }
    
    window.onload = function() {
      console.log("Page loaded. Waiting for Chart.js libraries...");
      
      // Wait for Chart.js libraries to load
      const checkLibraries = () => {
        if (chartLibrariesReady && typeof Chart !== 'undefined' && typeof moment !== 'undefined') {
          initializeApp();
        } else {
          // Still waiting for libraries
          setTimeout(checkLibraries, 100);
        }
      };
      
      checkLibraries();
    };
  </script>
